name: Update Instagram Followers Count

on:
  # Toutes les 6 heures
  schedule:
    - cron: '0 */6 * * *'
  # Déclenchement manuel
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    # Droits d'écriture pour committer le JSON mis à jour
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies (instagrapi)
      run: |
        python -m pip install --upgrade pip
        pip install instagrapi

    - name: Fetch followers via instagrapi
      env:
        INSTA_USERNAME: ${{ secrets.INSTA_USERNAME }}
        # Recommandé : cookie de session (aucun mot de passe en clair)
        INSTA_SESSION_ID: ${{ secrets.INSTA_SESSION_ID }}
        # Optionnel, utilisé seulement si INSTA_SESSION_ID est absent
        INSTA_PASSWORD: ${{ secrets.INSTA_PASSWORD }}
      run: python fetch_followers_instagrapi.py

    - name: Copy data to root for web access
      run: cp fils/followers_data.json followers_data.json

    - name: Commit and push new data
      id: commit
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: 'ACTION: Auto-update Instagram followers count'
        file_pattern: 'fils/followers_data.json followers_data.json'

    # Le commit ci-dessus (fait via GITHUB_TOKEN) ne déclenche PAS le workflow
    # de déploiement Firebase. On redéploie donc ici pour que nexus-hubs.web.app
    # reflète immédiatement le nouveau nombre d'abonnés.
    - name: Deploy to Firebase Hosting (refresh du compteur)
      if: steps.commit.outputs.changes_detected == 'true'
      uses: FirebaseExtended/action-hosting-deploy@v0
      with:
        repoToken: ${{ secrets.GITHUB_TOKEN }}
        firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        channelId: live
        projectId: nexus-hubs
