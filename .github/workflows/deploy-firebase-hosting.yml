name: Deploy Frontend to Firebase Hosting

# Déploie le frontend statique sur Firebase Hosting SANS terminal.
# Prérequis : ajouter le secret GitHub `FIREBASE_SERVICE_ACCOUNT`
# (voir DEPLOY-FIREBASE.md → "Déploiement sans terminal").

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Firebase Hosting (live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: nexus-hubs
